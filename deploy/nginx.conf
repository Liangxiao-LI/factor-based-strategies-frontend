# nginx site for the frontend on EC2 (Amazon Linux 2023)
# Copy to /etc/nginx/conf.d/fbs.conf, then: sudo nginx -t && sudo systemctl reload nginx
# Adjust root if the frontend repo lives elsewhere

server {
    listen 80;
    server_name _;

    # Static files built by npm run build
    root /home/ec2-user/factor-based-strategies-frontend/dist;
    index index.html;

    # The backend has no authentication: uncomment to require a password
    # (create the file with htpasswd, see README)
    # auth_basic "fbs";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Backend on the same machine. No trailing slash after the port, so
    # /api/tables reaches the backend as /api/tables
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The first schema request may wait for the backend to download INDICATORS
        proxy_read_timeout 300s;
    }

    # Hashed file names change on every build, so they can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback; index.html is never cached so a new build shows up at once
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
